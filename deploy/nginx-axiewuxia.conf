# Cấu hình hiệu năng nginx cho production (VPS Vietnix, phục vụ /var/www/axiewuxia/public/game).
#
# Đặt vào /etc/nginx/conf.d/ — nginx.conf của Debian/Ubuntu include sẵn thư mục đó vào http{}.
# Cài bằng: bash /var/www/axiewuxia/deploy/setup-nginx.sh
#
# ⚠ KHÔNG đặt `gzip on;` ở đây. /etc/nginx/nginx.conf của Debian/Ubuntu đã bật sẵn (dòng 46),
#   và nginx coi khai báo trùng trong cùng ngữ cảnh là lỗi nặng, chặn nạp toàn bộ cấu hình:
#       nginx: [emerg] "gzip" directive is duplicate
#   Thứ nginx bật sẵn nhưng KHÔNG cấu hình mới là gzip_types — mặc định chỉ có text/html, nên
#   game.js (application/javascript) vẫn đi thô 1,06 MB. Đó là thứ tệp này thêm vào.
gzip_vary         on;
gzip_min_length   1024;
gzip_comp_level   6;
gzip_proxied      any;
gzip_types        text/plain text/css application/javascript text/javascript
                  application/json image/svg+xml;

# Cache đặt bằng map + add_header ở tầng http, để KHÔNG phải đụng vào server block đang chạy.
# Thứ tự có ý nghĩa: nginx thử các biểu thức theo đúng thứ tự khai báo, khớp cái đầu là dừng.
map $uri $axie_cache {
    # Mặc định là mã và trang. Tên tệp trong public/game KHÔNG gắn mã băm, nên phải hỏi lại mỗi
    # lần — nếu không, sửa game.js rồi mà trình duyệt còn giữ bản cũ thì người chơi kẹt ở phiên
    # bản cũ và không có cách nào tự thoát. Không đổi thì nginx trả 304 rỗng, vẫn tiết kiệm gần
    # trọn băng thông.
    default                                     "no-cache";
    # Bộ chữ: tên tệp do Google đặt theo nội dung ⇒ nội dung đổi là tên đổi ⇒ khỏi hỏi lại lần nào.
    "~*^/fonts/.*\.woff2?$"                     "public, max-age=31536000, immutable";
    # Ảnh và nhạc: đổi nội dung dưới cùng một tên gần như không bao giờ xảy ra.
    "~*\.(png|jpe?g|gif|webp|svg|mp3|ogg|wav)$" "public, max-age=604800";
}
add_header Cache-Control $axie_cache always;
