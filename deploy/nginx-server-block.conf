# Server block ĐANG CHẠY trên production, chép nguyên văn từ VPS
# (/etc/nginx/sites-available/axiewuxia, lấy ngày 31.08.2026).
#
# Đây là BẢN SAO ĐỂ THAM CHIẾU, không phải nguồn sự thật — nginx trên VPS đọc file của nó, không
# đọc file này. Sửa ở đây KHÔNG có tác dụng gì cho tới khi ai đó chép lên máy. Giữ ở repo vì ngày
# 31.08 vừa cho thấy mất nginx là mất trang, mà cấu hình thì không có bản sao nào ngoài chính máy.
#
# Hai điều đáng chú ý:
# · root trỏ THẲNG vào public/game — nginx phục vụ tệp tĩnh, KHÔNG đi qua máy chủ Node. Nên phần
#   nén và Cache-Control viết trong api/lib/vite.ts hoàn toàn không tới người chơi; đó là việc của
#   nginx-axiewuxia.conf bên cạnh.
# · Không có add_header nào ở đây. Quan trọng: nginx chỉ kế thừa add_header từ tầng ngoài vào một
#   block khi block đó KHÔNG tự khai add_header của riêng nó. Nếu sau này thêm add_header vào đây,
#   toàn bộ Cache-Control đặt ở tầng http sẽ im lặng ngừng áp dụng.

server {
    listen 80;
    server_name 14.225.204.107;
    root /var/www/axiewuxia/public/game;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
